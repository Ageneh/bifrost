services:
  bifrost:
    build: .
    container_name: bifrost
    restart: unless-stopped
    network_mode: host
    environment:
      BIFROST_CONFIG: /app/data/config.yaml
    volumes:
      # One directory holds everything Bifrost reads and writes: config.yaml,
      # config.draft.yaml, config.yaml.bak, state.yaml and the certificate.
      # Relative paths in config.yaml resolve against this directory.
      - ./data:/app/data
