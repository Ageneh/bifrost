# Path-prefix proxy in the shape of Home Assistant's ingress: the browser
# sees /api/hassio_ingress/<id>/..., Bifrost sees /... plus X-Ingress-Path.
# scripts/ui-prefix.sh fills in @LISTEN@ and @UPSTREAM@ before mounting it.
events {}

http {
    server {
        listen @LISTEN@;

        location /api/hassio_ingress/w02fixture/ {
            proxy_pass http://@UPSTREAM@/;
            proxy_set_header X-Ingress-Path /api/hassio_ingress/w02fixture;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
